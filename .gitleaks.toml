title = "outlook-remote-mcp secret scanning"

[extend]
useDefault = true

# The only reviewed exception: the exact, well-known Microsoft Graph delegated-permission IDs that
# Microsoft publishes (public identifiers, not credentials). Matched against the detected secret
# value only (the default target), so no other value, name, or line is affected. Add an ID here only for
# a new Graph permission, verified against Microsoft's published permission reference.
# CI ignores inline gitleaks:allow comments (--ignore-gitleaks-allow), so this file is the only exception path.
[allowlist]
description = "Public Microsoft Graph permission IDs"
regexes = [
  '''^e1fe6dd8-ba31-4d61-89e7-88639da4683d$''', # User.Read
  '''^570282fd-fa5c-430d-a7fd-fc8dc98a9dca$''', # Mail.Read
  '''^024d486e-b451-40bb-833d-3e66d98c5c73$''', # Mail.ReadWrite
  '''^465a38f9-76ea-45b9-9f34-9e8b0d4b0b42$''', # Calendars.Read
  '''^ff74d97f-43af-4b68-9f2a-b77ee6968c5d$''', # Contacts.Read
  '''^7427e0e9-2fba-42fe-b0c0-848c9e6a8182$''', # offline_access
  '''^37f7f235-527c-4136-accd-4a02d197296e$''', # openid
  '''^14dad69e-099b-42c9-810b-d002981feec1$''', # profile
  '''^64a6cdd6-aab1-4aaf-94b8-3cc8405e90d0$''', # email
]
